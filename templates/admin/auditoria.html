{% extends "layouts/admin_base.html" %}
{% block title %}Auditoría{% endblock %}
{% block module_content %}
<h1>Registro de auditoría</h1>
<div class="table-wrap"><table class="data-table"><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>
{% for l in logs %}<tr><td>{{ l.created_at[:19] }}</td><td>{{ l.nombre or '—' }}</td><td>{{ l.accion }}</td><td>{{ l.detalle or '' }}</td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}
