{% extends "layouts/estudiante_base.html" %}
{% block title %}Bitácora reflexiva | {{ scenario_nombre }}{% endblock %}
{% block module_content %}
<section class="panel neuro-panel">
    <span class="neuro-tag">BITÁCORA REFLEXIVA</span>
    <h1>{{ scenario_nombre }}</h1>
    <p>Registra tu análisis clínico-ético tras completar este escenario. Mínimo 20 caracteres.</p>
    <form method="post" class="admin-form">
        <label class="field">
            <span>Reflexión</span>
            <textarea name="contenido" rows="8" required placeholder="¿Qué intervenciones priorizarías? ¿Qué marco normativo aplicaste?"></textarea>
        </label>
        <button type="submit" class="btn btn-neuro">Guardar y continuar</button>
    </form>
</section>
{% endblock %}
