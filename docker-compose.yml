services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dilema
      POSTGRES_USER: dilema
      POSTGRES_PASSWORD: dilema
    ports:
      - "5432:5432"
    volumes:
      - dilema-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dilema -d dilema"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dilema
      SPRING_DATASOURCE_USERNAME: dilema
      SPRING_DATASOURCE_PASSWORD: dilema
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
volumes:
  dilema-datos:
