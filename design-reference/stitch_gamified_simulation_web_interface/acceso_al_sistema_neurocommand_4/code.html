<style>
      body {
        background-color: #111318;
        background-image: linear-gradient(rgba(0, 219, 233, 0.03) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(0, 219, 233, 0.03) 1px, transparent 1px);
        background-size: 24px 24px;
        overflow-x: hidden;
      }

      .scanline {
        width: 100%;
        height: 100px;
        z-index: 10;
        background: linear-gradient(0deg, rgba(0, 219, 233, 0) 0%, rgba(0, 219, 233, 0.05) 50%, rgba(0, 219, 233, 0) 100%);
        opacity: 0.1;
        position: fixed;
        bottom: 100%;
        animation: scan 8s linear infinite;
        pointer-events: none;
      }

      @keyframes scan {
        0% { bottom: 100%; }
        100% { bottom: -100px; }
      }

      .cyber-glow {
        box-shadow: 0 0 15px rgba(0, 219, 233, 0.15);
      }

      .input-glow:focus-within {
        box-shadow: 0 0 10px rgba(0, 219, 233, 0.3);
        border-color: #00dbe9;
      }

      .biometric-ring {
        border: 2px solid #00dbe9;
        border-radius: 50%;
        animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      @keyframes pulse-ring {
        0% { transform: scale(0.95); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.5; }
        100% { transform: scale(0.95); opacity: 1; }
      }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md">
<div class="scanline"></div>
<!-- Top Navigation Anchor -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-edge-margin h-16 bg-surface/70 backdrop-blur-xl border-b border-outline-variant/20">
<div class="flex items-center gap-sm">
<span class="font-label-caps text-label-caps text-primary-container tracking-[0.2em]">NEURAL_SIM_v1.0</span>
</div>
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-primary-fixed-dim" data-icon="timer">timer</span>
<div class="w-8 h-8 rounded-full bg-surface-container-highest border border-primary/20 flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]" data-icon="lock">lock</span>
</div>
</div>
</header>
<main class="flex-1 flex flex-col items-center justify-center p-edge-margin mt-16 pb-xl">
<!-- Logo/Brand Hero Section -->
<div class="text-center mb-xl">
<div class="w-20 h-20 mx-auto mb-md relative">
<div class="absolute inset-0 biometric-ring opacity-20"></div>
<div class="w-full h-full bg-surface-container-high rounded-full border border-primary/30 flex items-center justify-center cyber-glow">
<span class="material-symbols-outlined text-primary-fixed-dim text-[40px]" data-icon="psychology" style="font-variation-settings: 'FILL' 1;">psychology</span>
</div>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary-container mb-xs">AUTORIZACIÓN_REQUERIDA</h1>
<p class="font-label-mono text-label-mono text-on-surface-variant opacity-70">PUERTA DE SIMULACIÓN ENCRIPTADA // V_9.42</p>
</div>
<!-- Login Card -->
<div class="w-full max-w-[400px] space-y-lg">
<section class="bg-surface-container-lowest/80 backdrop-blur-xl border border-primary/20 p-lg rounded-lg relative overflow-hidden">
<!-- Data Reference ID -->
<div class="absolute top-2 right-2 font-label-mono text-[10px] text-primary/40 uppercase tracking-widest">
                REF_ID: 992-SEC
            </div>
<form class="space-y-md" onsubmit="event.preventDefault();">
<!-- Role Selection -->
<div class="grid grid-cols-3 gap-xs mb-lg">
<button class="role-btn active p-sm border border-primary bg-primary/10 text-primary font-label-mono text-label-mono rounded-xs transition-all flex flex-col items-center gap-xs" type="button">
<span class="material-symbols-outlined text-[16px]" data-icon="school">school</span>
                        ESTUDIANTE
                    </button>
<button class="role-btn p-sm border border-outline-variant/30 text-on-surface-variant font-label-mono text-label-mono rounded-xs hover:bg-surface-variant transition-all flex flex-col items-center gap-xs" type="button">
<span class="material-symbols-outlined text-[16px]" data-icon="supervisor_account">supervisor_account</span>
                        DOCENTE
                    </button>
<button class="role-btn p-sm border border-outline-variant/30 text-on-surface-variant font-label-mono text-label-mono rounded-xs hover:bg-surface-variant transition-all flex flex-col items-center gap-xs" type="button">
<span class="material-symbols-outlined text-[16px]" data-icon="terminal">terminal</span>
                        ADMIN
                    </button>
</div>
<!-- Credential Fields -->
<div class="space-y-sm">
<div class="group flex flex-col">
<label class="font-label-mono text-[10px] text-primary mb-1 uppercase tracking-tighter">Token_Identidad (Email)</label>
<div class="relative flex items-center input-glow transition-all duration-300 border border-outline-variant/30 bg-surface-dim/50 rounded-xs px-md py-sm">
<span class="material-symbols-outlined text-on-surface-variant mr-md text-[18px]" data-icon="alternate_email">alternate_email</span>
<input class="bg-transparent border-none focus:ring-0 text-on-surface w-full font-label-mono text-body-md placeholder:opacity-30" placeholder="NOMBRE_USUARIO@NEURAL.EDU" type="email">
</div>
</div>
<div class="group flex flex-col">
<label class="font-label-mono text-[10px] text-primary mb-1 uppercase tracking-tighter">Código_Acceso (Password)</label>
<div class="relative flex items-center input-glow transition-all duration-300 border border-outline-variant/30 bg-surface-dim/50 rounded-xs px-md py-sm">
<span class="material-symbols-outlined text-on-surface-variant mr-md text-[18px]" data-icon="key">key</span>
<input class="bg-transparent border-none focus:ring-0 text-on-surface w-full font-label-mono text-body-md placeholder:opacity-30" placeholder="••••••••••••" type="password">
</div>
</div>
</div>
<!-- Action Area -->
<div class="pt-md">
<button class="w-full bg-primary-container text-on-primary font-label-caps text-label-caps py-md rounded-xs border border-primary/50 cyber-glow hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-sm">
                        INICIALIZAR_SESIÓN
                        <span class="material-symbols-outlined text-[18px]" data-icon="login">login</span>
</button>
</div>
</form>
</section>
<!-- Biometric Simulation Toggle -->
<div class="flex flex-col items-center gap-md">
<button class="flex items-center gap-md text-on-surface-variant hover:text-primary transition-colors font-label-mono text-label-mono py-sm px-lg bg-surface-container-high/40 rounded-full border border-outline-variant/20" id="biometric-trigger">
<span class="material-symbols-outlined" data-icon="fingerprint" id="bio-icon">fingerprint</span>
                ACCESO BIO_SINC
            </button>
<a class="font-label-mono text-[10px] text-on-surface-variant/50 hover:text-primary-container transition-colors tracking-widest uppercase" href="#">¿Olvidó sus credenciales? Contacte Soporte_Técnico</a>
</div>
</div>
<!-- System Stats / Footer Grid -->
<div class="mt-xl grid grid-cols-2 md:grid-cols-4 gap-md w-full max-w-4xl">
<div class="p-md border-l border-primary/20 bg-surface-container-low/30">
<div class="font-label-mono text-[10px] text-on-surface-variant opacity-60">MOTOR_SIM</div>
<div class="font-data-numeral text-primary-fixed-dim">ESTABLE</div>
</div>
<div class="p-md border-l border-primary/20 bg-surface-container-low/30">
<div class="font-label-mono text-[10px] text-on-surface-variant opacity-60">CARGA_MED</div>
<div class="font-data-numeral text-primary-fixed-dim">12.4%</div>
</div>
<div class="p-md border-l border-primary/20 bg-surface-container-low/30">
<div class="font-label-mono text-[10px] text-on-surface-variant opacity-60">NODOS_ACTIVOS</div>
<div class="font-data-numeral text-primary-fixed-dim">1,024</div>
</div>
<div class="p-md border-l border-primary/20 bg-surface-container-low/30">
<div class="font-label-mono text-[10px] text-on-surface-variant opacity-60">ENCRIPTACIÓN</div>
<div class="font-data-numeral text-primary-fixed-dim">AES_512</div>
</div>
</div>
</main>
<!-- Visual Polish: Noise Texture Overlay -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] z-[100]" style="background-image: url('https://www.transparenttextures.com/patterns/p6.png')"></div>
<script>
    // Micro-interactions for role selection
    const roleButtons = document.querySelectorAll('.role-btn');
    roleButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            roleButtons.forEach(b => {
                b.classList.remove('active', 'border-primary', 'bg-primary/10', 'text-primary');
                b.classList.add('border-outline-variant/30', 'text-on-surface-variant');
            });
            btn.classList.add('active', 'border-primary', 'bg-primary/10', 'text-primary');
            btn.classList.remove('border-outline-variant/30', 'text-on-surface-variant');
        });
    });

    // Biometric Simulation
    const bioBtn = document.getElementById('biometric-trigger');
    const bioIcon = document.getElementById('bio-icon');
    
    bioBtn.addEventListener('click', () => {
        bioIcon.innerText = 'radar';
        bioBtn.classList.add('animate-pulse', 'text-primary', 'border-primary/50');
        bioBtn.innerHTML = `<span class="material-symbols-outlined animate-spin" data-icon="settings_slow_motion">settings_slow_motion</span> ESCANEANDO_RETINA...`;
        
        setTimeout(() => {
            bioBtn.classList.remove('animate-pulse');
            bioBtn.innerHTML = `<span class="material-symbols-outlined text-tertiary-fixed-dim" data-icon="check_circle">check_circle</span> IDENTIDAD_CONFIRMADA`;
            bioBtn.classList.add('border-tertiary/50', 'text-tertiary');
        }, 2000);
    });
</script>
</body></html>
